# SDK alias = sdk_index + 1. XML already applies polarity and joint zero.
hardware:
  backend: loong
  cycle_ns: 5000000
  watchdog_s: 0.05
  activation_timeout_s: 10.0
  commissioned: false
  motor_watchdog_confirmed: false
  sdk_xml: loong_can_example.xml
  sdk_cpu: 0
  feedback_timeout_s: 0.05
  command_timeout_s: 0.05
kinematics:
  calibrated: false
  description: Example geometry; the supplied SDK XML contains no kinematic model
  tool_xyz: [0.1, 0.0, 0.0]
  tool_rpy: [0.0, 0.0, 0.0]
joints:
  - &axis
    name: joint1
    sdk_index: 0
    lower: -2.8
    upper: 2.8
    max_velocity: 1.0
    max_acceleration: 2.0
    direction: 1
    kp: 20.0
    kd: 0.5
    origin_xyz: [0.0, 0.0, 0.1]
    origin_rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
  - {<<: *axis, name: joint2, sdk_index: 1, origin_xyz: [0.0, 0.0, 0.1], axis: [0.0, 1.0, 0.0]}
  - {<<: *axis, name: joint3, sdk_index: 2, origin_xyz: [0.3, 0.0, 0.0], axis: [0.0, 1.0, 0.0]}
  - {<<: *axis, name: joint4, sdk_index: 3, origin_xyz: [0.25, 0.0, 0.0], axis: [1.0, 0.0, 0.0]}
  - {<<: *axis, name: joint5, sdk_index: 4, origin_xyz: [0.08, 0.0, 0.0], axis: [0.0, 1.0, 0.0]}
  - {<<: *axis, name: joint6, sdk_index: 5, origin_xyz: [0.07, 0.0, 0.0], axis: [1.0, 0.0, 0.0]}

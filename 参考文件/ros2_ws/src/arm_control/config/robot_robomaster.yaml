# Reference design: six C620/M3508 joints, three per channel on a dual-channel USBCANFD.
# rm_mock runs the real current-frame/PID/encoder path against an emulated plant.
hardware:
  backend: rm_mock
  cycle_ns: 5000000
  watchdog_s: 0.05
  activation_timeout_s: 5.0
  commissioned: false
  can_protocol: robomaster_c620
  can_channels: 2
  can_interface: can0
  can_second_interface: can1
  can_bitrate: 1000000
  can_feedback_hz: 1000
  feedback_timeout_s: 0.02
  command_timeout_s: 0.05
  motor_watchdog_confirmed: false
  startup_reference_confirmed: false
  group_exclusive_confirmed: false
  zcan_device_type: 0  # Choose exact ZCAN_USBCANFD_* constant from the supplied vendor header.
  zcan_device_index: 0
  zcan_channel: 0
  zcan_fd_adapter: true
  zcan_data_bitrate: 5000000
  zcan_timing0: 0
  zcan_timing1: 0
kinematics:
  calibrated: false
  description: Example arm dimensions, not measurements of your mechanical arm
  tool_xyz: [0.1, 0.0, 0.0]
  tool_rpy: [0.0, 0.0, 0.0]
joints:
  - &axis
    name: joint1
    can_channel: 0
    motor_id: 1
    lower: -2.8
    upper: 2.8
    max_velocity: 1.0
    max_acceleration: 2.0
    direction: 1
    gear_ratio: 19.203208556
    startup_position: 0.0
    position_kp: 5.0
    velocity_kp: 3.0
    velocity_ki: 1.0
    current_limit_a: 3.0
    max_temperature_c: 80.0
    origin_xyz: [0.0, 0.0, 0.1]
    origin_rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
  - {<<: *axis, name: joint2, motor_id: 2, origin_xyz: [0.0, 0.0, 0.1], axis: [0.0, 1.0, 0.0]}
  - {<<: *axis, name: joint3, motor_id: 3, origin_xyz: [0.3, 0.0, 0.0], axis: [0.0, 1.0, 0.0]}
  - {<<: *axis, name: joint4, can_channel: 1, motor_id: 1, origin_xyz: [0.25, 0.0, 0.0], axis: [1.0, 0.0, 0.0]}
  - {<<: *axis, name: joint5, can_channel: 1, motor_id: 2, origin_xyz: [0.08, 0.0, 0.0], axis: [0.0, 1.0, 0.0]}
  - {<<: *axis, name: joint6, can_channel: 1, motor_id: 3, origin_xyz: [0.07, 0.0, 0.0], axis: [1.0, 0.0, 0.0]}

name: ROS2 simulation validation
on: [push, pull_request, workflow_dispatch]
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-yaml python3-numpy ros-humble-ros2-control ros-humble-ros2-controllers ros-humble-robot-state-publisher ros-humble-rosbag2
      - name: Build and unit tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd 参考文件/ros2_ws
          colcon build --event-handlers console_direct+
          source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
      - name: End-to-end simulation
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source 参考文件/ros2_ws/install/setup.bash
          for backend in sim can_mock rm_mock mit_mock; do
            python3 参考文件/ros2_ws/src/arm_control/test/integration_sim.py --backend "$backend"
          done
